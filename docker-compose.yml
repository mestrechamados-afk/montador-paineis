# Sobe o app + PostgreSQL. Uso: cp .env.example .env  (edite os segredos)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-montador}
      POSTGRES_USER: ${POSTGRES_USER:-montador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-montador} -d ${POSTGRES_DB:-montador}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-montador}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-montador}
      PGSSL: disable
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
