<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montador de painéis elétricos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D8DBD5; --surface:#EEF0EC; --surface2:#E2E5DF; --line:#B8BDB6; --ink:#1B2A35; --muted:#55646E;
  --run:#1F8E47; --stop:#C3302A; --warn:#D98E04; --neutral:#2360A8; --live:#C3302A;
  --scene:#CBD0C9; --focus:#2360A8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#182026; --surface:#212A31; --surface2:#29333B; --line:#3A464F; --ink:#E3E8E4; --muted:#9BA7AF;
    --run:#3CB766; --stop:#E5574E; --warn:#F0B32E; --neutral:#6399DE; --live:#F0645A;
    --scene:#1C242A; --focus:#6399DE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#182026; --surface:#212A31; --surface2:#29333B; --line:#3A464F; --ink:#E3E8E4; --muted:#9BA7AF;
  --run:#3CB766; --stop:#E5574E; --warn:#F0B32E; --neutral:#6399DE; --live:#F0645A;
  --scene:#1C242A; --focus:#6399DE; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.dlg{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,94vw);max-height:90vh}
.dlg::backdrop{background:rgba(10,20,30,.45)}
.dlg .dh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dlg .dh h2{margin:0}
.dlg .db{padding:6px 16px 16px;overflow:auto}
.dlg fieldset{border:1px solid var(--line);border-radius:6px;margin:12px 0 0;padding:8px 12px 4px}
.dlg legend{font:600 16px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;padding:0 6px}
.dlg .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.dlg .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.dlg textarea{width:100%;min-height:54px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
@media(max-width:640px){.dlg .g2,.dlg .g3{grid-template-columns:1fr}}
.dlg .lgprev{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dlg .lgprev .pv{width:220px;height:90px;border:1px dashed var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;color:#8a949a;font-size:13px}
.dlg .lgprev .pv img{max-width:204px;max-height:78px;object-fit:contain}
.dlg .lgprev .bt{display:flex;flex-direction:column;gap:6px}
.pjsum{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.4}
.pjsum b{color:var(--ink);font-weight:600}
#hdrLogo{height:32px;max-width:160px;object-fit:contain;align-self:center}
.logobox{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:5px;padding:8px;background:var(--surface2);min-height:58px}
.logobox img{max-height:40px;max-width:96px;object-fit:contain;background:#fff;border-radius:3px;padding:2px}
.logobox .sp{flex:1;font-size:13px;color:var(--muted)}
h1{font:600 24px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
header p{margin:0;color:var(--muted);font-size:14px}
main{display:grid;grid-template-columns:330px minmax(0,1fr) 370px;min-height:0}
aside{overflow:auto;background:var(--surface);padding:14px 16px 28px}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
h2{font:600 19px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:18px 0 8px}
h2:first-child{margin-top:2px}
h3{font:600 16px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:14px 0 6px;color:var(--muted)}
label.f{display:grid;gap:3px;font-size:13px;color:var(--muted);margin-bottom:9px}
label.f > span{display:flex;justify-content:space-between}
select,input[type=text],input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);color:var(--ink);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:5px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.run{background:var(--run);color:#fff;border-color:transparent;border-radius:999px}
.btn.stop{background:var(--stop);color:#fff;border-color:transparent;border-radius:999px}
.btn.warn{background:var(--warn);color:#1b1b1b;border-color:transparent}
.btn.reset{background:var(--neutral);color:#fff;border-color:transparent;border-radius:999px}
.nrbox{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:5px;padding:10px;background:var(--surface2);margin-bottom:6px}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.chk li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:13.5px}
.chk li i{font-style:normal;font-weight:700;text-align:center}
.chk li.ok i{color:var(--run)} .chk li.no i{color:var(--stop)} .chk li.na i{color:var(--muted)}
.chk small{display:block;color:var(--muted);font-size:12px}
.score{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 8px;font-size:14px}
.score b{font:700 22px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 9px;font-size:13px}
.btn.block{width:100%}
.load{border:1px solid var(--line);border-left:4px solid var(--neutral);border-radius:5px;padding:10px 10px 4px;margin-bottom:10px;background:var(--surface2)}
.load header{all:unset;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{font:700 15px/1 "Barlow Condensed","Arial Narrow",sans-serif;background:var(--ink);color:var(--surface);padding:3px 6px;border-radius:3px}
.load header input{flex:1}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.center{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.toolbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface2);padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.viewer{position:relative;min-height:0;background:var(--scene);overflow:hidden}
#c3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c3d.dragging{cursor:grabbing}
#photoImg{position:absolute;display:none;pointer-events:none;user-select:none}
.viewer.photo #photoImg{display:block}
.viewer.photo #c3d{position:absolute;cursor:move;z-index:1}
.viewer.photo .hint{z-index:2}
.ppanel{position:absolute;left:12px;top:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:3}
.ppanel h4{font:600 16px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.ppanel label.r{display:grid;grid-template-columns:88px 1fr 50px;gap:6px;align-items:center;margin:4px 0;color:var(--muted)}
.ppanel label.r output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.ppanel .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ppanel .chk2{display:flex;gap:6px;align-items:center;margin:4px 0}
.ppanel p{margin:4px 0;color:var(--muted)}
#dia{position:absolute;inset:0;overflow:auto;padding:14px;background:var(--diagram,var(--surface))}
#dia .dia-fs{position:sticky;float:right;top:0;margin:-4px -4px 0 0}
#dia svg{display:block;min-width:600px;width:100%;height:auto;max-height:100%}
#wir{position:absolute;inset:0;overflow:auto;padding:14px;background:var(--diagram,var(--surface))}
#wir svg{display:block;height:auto}
#full{position:absolute;inset:0;overflow:auto;padding:0 14px 14px;background:var(--bg)}
#full .ftool{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;background:var(--bg)}
#full .ftool.min{padding:6px 0}
#full .ftool .fsp{flex:1}
#full .fsheet{margin:0 0 18px;box-shadow:0 2px 10px rgba(0,0,0,.12);width:max-content;scroll-margin-top:60px}
#full .fsheet svg{display:block}
#wir .wt{border-collapse:collapse;font-size:13px;margin-top:14px;min-width:620px}
#wir .wt th,#wir .wt td{border-bottom:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}
#wir .wt th{color:var(--muted);font-weight:600}
#wir .sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
#wir .note{font-size:12.5px;color:var(--muted);max-width:760px;margin:8px 0 0}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:4px 8px;border-radius:4px;pointer-events:none}
.pick{position:absolute;right:12px;top:12px;max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.pick b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:16px}
.err3d{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
.sim{border-top:1px solid var(--line);background:var(--surface);max-height:44vh;overflow:auto;padding:10px 12px}
.simtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lamp{width:11px;height:11px;border-radius:50%;background:#8a9297;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.lamp.on{background:var(--run);box-shadow:0 0 6px var(--run)}
.lamp.trip{background:var(--stop);box-shadow:0 0 6px var(--stop)}
.lamp.wait{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.fold{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding:6px 0}
.foldbtn{border:0;background:none;padding:4px 6px;border-radius:4px;cursor:pointer;font:600 15px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.foldbtn:hover{background:var(--surface2)}
.foldbtn .chev{display:inline-block;width:12px;color:var(--muted)}
.foldbtn .cnt{font:600 12px/1 Barlow,sans-serif;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 13px/1 "Barlow Condensed","Arial Narrow",sans-serif;border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:var(--surface2)}
.srows[hidden],.simbot[hidden]{display:none}
.srow{display:grid;grid-template-columns:minmax(140px,1fr) minmax(250px,1.4fr) auto;gap:6px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.srow .nm{display:flex;gap:8px;align-items:center;min-width:0}
.srow .nm span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meas{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-size:14px;align-items:center;flex-wrap:wrap}
.meas small{color:var(--muted)}
.bar{height:6px;width:70px;background:var(--surface2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--neutral);width:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.acts select{width:auto;padding:4px 6px;font-size:13px}
.acts input[type=range]{width:90px}
.simbot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-top:8px}
#spark{width:100%;height:80px;display:block;background:var(--surface2);border:1px solid var(--line);border-radius:4px}
.log{height:80px;overflow:auto;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-variant-numeric:tabular-nums}
.log div{padding:1px 0;border-bottom:1px dotted var(--line)}
.log .e{color:var(--stop)}
.cap{font-size:12px;color:var(--muted);margin:0 0 3px}
dl.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dl.sum dt{color:var(--muted)}
dl.sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.meter{margin:10px 0 4px}
.meter .track{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--run)}
.meter .track i.w{background:var(--warn)}
.meter .track i.e{background:var(--stop)}
.meter p{display:flex;justify-content:space-between;margin:0 0 3px;font-size:13px;color:var(--muted)}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alerts li{font-size:13.5px;padding:7px 9px;border-radius:4px;border-left:4px solid var(--warn);background:var(--surface2)}
.alerts li.e{border-left-color:var(--stop)}
.alerts li.i{border-left-color:var(--neutral)}
.alerts li.ok{border-left-color:var(--run)}
.bom{display:grid;gap:4px}
.item{display:grid;grid-template-columns:52px 1fr;gap:2px 8px;padding:7px 8px;border-radius:4px;border:1px solid transparent;cursor:pointer}
.item:hover{border-color:var(--line)}
.item.sel{border-color:var(--neutral);background:color-mix(in srgb,var(--neutral) 10%,transparent)}
.item .tg{font:700 14px/1.3 "Barlow Condensed","Arial Narrow",sans-serif}
.item .ds{font-size:13.5px}
.item .mt{grid-column:2;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item select{width:auto;padding:3px 6px;font-size:13px;margin-top:3px}
.item .mdl{grid-column:2;font-size:13px;color:var(--ink)}
.item .mdl b{font-weight:600}
.item select.under{border-color:var(--stop);color:var(--stop)}
.item select.over{border-color:var(--warn)}
.qty{font-variant-numeric:tabular-nums}
.foot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
@media (max-width:1180px){
  .app{height:auto}
  body{height:auto}
  main{grid-template-columns:1fr}
  .center{order:-1;grid-template-rows:auto 58vh auto}
  aside{overflow:visible;border:0 !important;border-top:1px solid var(--line) !important}
  .sim{max-height:none}
}
@media (max-width:640px){
  .srow{grid-template-columns:1fr}
  .acts{justify-content:flex-start}
  .simbot{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
/* ===================== Tema moderno ===================== */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F4F6F8; --line:#DFE4E9; --ink:#15212C; --muted:#5F6D78;
  --run:#1E9150; --stop:#D23A31; --warn:#E39B0E; --neutral:#2F6BDB; --live:#D23A31; --scene:#DCE2E7; --focus:#2F6BDB;
  --r-lg:14px; --r-md:10px; --r-sm:8px;
  --sh-1:0 1px 2px rgba(16,32,48,.06),0 1px 1px rgba(16,32,48,.04);
  --sh-2:0 6px 20px rgba(16,32,48,.08),0 2px 6px rgba(16,32,48,.05);
  --sh-3:0 24px 60px rgba(10,20,30,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D25; --surface2:#1B252F; --line:#28343F; --ink:#E7ECF0; --muted:#94A2AE;
  --run:#3CC474; --stop:#F0625A; --warn:#F2B53A; --neutral:#6E9DF0; --live:#F0625A; --scene:#121A21; --focus:#6E9DF0;
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 8px 24px rgba(0,0,0,.35); --sh-3:0 24px 60px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{--bg:#0E141A; --surface:#151D25; --surface2:#1B252F; --line:#28343F; --ink:#E7ECF0; --muted:#94A2AE;
  --run:#3CC474; --stop:#F0625A; --warn:#F2B53A; --neutral:#6E9DF0; --live:#F0625A; --scene:#121A21; --focus:#6E9DF0;
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 8px 24px rgba(0,0,0,.35); --sh-3:0 24px 60px rgba(0,0,0,.55);}
body{font-size:14.5px;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* cabeçalho */
.app>header{padding:10px 20px;gap:4px 16px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh-1);position:relative;z-index:5}
h1{font-size:23px;font-weight:700;letter-spacing:.005em}
.app>header p{font-size:13.5px}
#hdrLogo{height:34px;border-radius:6px}

/* grade principal com respiro */
main{gap:12px;padding:12px;grid-template-columns:320px minmax(0,1fr) 360px}
aside{background:var(--surface);border:1px solid var(--line) !important;border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px 16px 28px}
aside.left,aside.right{border-left:1px solid var(--line);border-right:1px solid var(--line)}
h2{font-size:18px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--neutral);opacity:.85}
h3{font-size:15px;margin:16px 0 8px}

/* campos */
label.f{font-size:12.5px;gap:5px;margin-bottom:10px}
select,input[type=text],input[type=number],input[type=email],input[type=date],textarea{height:36px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:14px;transition:border-color .15s,box-shadow .15s}
textarea{height:auto}
select:hover,input:hover{border-color:color-mix(in srgb,var(--muted) 45%,var(--line))}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
input[type=checkbox]{accent-color:var(--neutral);width:16px;height:16px}
input[type=range]{accent-color:var(--neutral)}

/* botões */
.btn{min-height:34px;height:auto;padding:6px 13px;white-space:nowrap;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);font-weight:600;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface2);border-color:color-mix(in srgb,var(--muted) 35%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn.small{min-height:30px;padding:4px 11px;font-size:13px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 88%,var(--neutral))}
.btn.run,.btn.stop,.btn.reset{border-radius:999px;box-shadow:0 1px 0 rgba(0,0,0,.08),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.run:hover{background:color-mix(in srgb,var(--run) 90%,#000)}.btn.stop:hover{background:color-mix(in srgb,var(--stop) 90%,#000)}.btn.reset:hover{background:color-mix(in srgb,var(--neutral) 90%,#000)}
.btn.warn{border-radius:999px}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--neutral) 14%,var(--surface));color:var(--ink);border-color:color-mix(in srgb,var(--neutral) 45%,var(--line))}
.btn.block{min-height:38px}
.row2 .btn{padding:6px 8px;font-size:13.5px}

/* cartões de máquina */
.load{border:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r-md);background:var(--surface2);padding:12px 12px 4px;box-shadow:none}
.load header{margin-bottom:10px}
.tag{border-radius:6px;padding:4px 7px;background:var(--ink);letter-spacing:.02em}
.x{width:28px;height:28px;border-radius:6px;display:grid;place-items:center}.x:hover{background:var(--surface);color:var(--stop)}
.nrbox{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-left-width:1px;border-radius:var(--r-md);background:color-mix(in srgb,var(--warn) 7%,var(--surface))}
.pjsum{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}

/* coluna central */
.center{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.toolbar{padding:10px 12px;gap:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.seg{border:0;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border-radius:8px;background:transparent;padding:6px 13px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.viewer{margin:0;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--scene) 70%,#fff) 0%,var(--scene) 70%)}
.hint{border-radius:999px;padding:5px 12px;backdrop-filter:blur(6px);background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line)}
.pick{border-radius:var(--r-md);box-shadow:var(--sh-2);backdrop-filter:blur(8px);background:color-mix(in srgb,var(--surface) 92%,transparent)}
.ppanel{border-radius:var(--r-lg);box-shadow:var(--sh-2);backdrop-filter:blur(8px);background:color-mix(in srgb,var(--surface) 94%,transparent)}
#dia,#wir{background:var(--diagram,var(--surface))}
#full{background:var(--surface2)}
#full .ftool{background:color-mix(in srgb,var(--surface2) 90%,transparent);backdrop-filter:blur(6px)}
#full .fsheet{border-radius:6px;overflow:hidden;box-shadow:var(--sh-2)}

/* simulação */
.sim{background:var(--surface);border-top:1px solid var(--line);padding:12px 14px}
.simtop{gap:10px}
.status{font-size:13px}
.lamp{width:10px;height:10px}
.fold{border-top:0;padding:8px 0 4px}
.foldbtn{border-radius:8px;padding:5px 8px}
.chip{background:var(--surface2);border-color:var(--line);padding:4px 10px}
.srow{border-top:0;border-radius:var(--r-md);padding:8px 10px;margin:2px 0;transition:background .15s}
.srow:hover{background:var(--surface2)}
.srows .srow+.srow{box-shadow:0 -1px 0 var(--line)}
.srows .srow:hover+.srow,.srows .srow:hover{box-shadow:none}
.bar{height:6px;border-radius:999px;border:0;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.bar i{border-radius:999px;background:linear-gradient(90deg,var(--neutral),color-mix(in srgb,var(--neutral) 60%,#7fd4ff))}
.acts select{height:30px;border-radius:8px}
.simbot{gap:14px;margin-top:10px}
#spark,.log{border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface2)}
.log div{border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding:3px 0}

/* painel direito */
dl.sum{gap:6px 12px;font-size:14px}
.meter .track{height:8px;border-radius:999px;border:0;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.meter .track i{border-radius:999px}
.alerts{gap:8px}
.alerts li{border-left:0;border-radius:var(--r-md);padding:9px 11px 9px 34px;position:relative;background:color-mix(in srgb,var(--warn) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line))}
.alerts li::before{content:"!";position:absolute;left:10px;top:9px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 Barlow,sans-serif;color:#fff;background:var(--warn)}
.alerts li.e{background:color-mix(in srgb,var(--stop) 8%,var(--surface));border-color:color-mix(in srgb,var(--stop) 30%,var(--line))}.alerts li.e::before{background:var(--stop)}
.alerts li.i{background:color-mix(in srgb,var(--neutral) 7%,var(--surface));border-color:color-mix(in srgb,var(--neutral) 25%,var(--line))}.alerts li.i::before{content:"i";background:var(--neutral)}
.alerts li.ok{background:color-mix(in srgb,var(--run) 8%,var(--surface));border-color:color-mix(in srgb,var(--run) 28%,var(--line))}.alerts li.ok::before{content:"✓";background:var(--run)}
.chk li{padding:6px 8px;border-radius:8px}.chk li:hover{background:var(--surface2)}
.score b{font-size:26px}
.item{border-radius:var(--r-md);padding:9px 10px;transition:background .15s,border-color .15s}
.item:hover{background:var(--surface2);border-color:var(--line)}
.item.sel{border-color:color-mix(in srgb,var(--neutral) 55%,var(--line));background:color-mix(in srgb,var(--neutral) 8%,var(--surface))}
.item select{height:30px}

/* diálogos */
.dlg{border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-3)}
.dlg::backdrop{background:rgba(12,20,28,.42);backdrop-filter:blur(3px)}
.dlg .dh{padding:14px 20px;background:var(--surface)}
.dlg .db{padding:8px 20px 18px}
.dlg fieldset{border-radius:var(--r-md);padding:10px 14px 6px;background:var(--surface2)}
.dlg .df{padding:14px 20px;background:var(--surface)}

@media (max-width:1180px){main{padding:8px;gap:8px;grid-template-columns:1fr}.center{order:-1;overflow:visible}.center .viewer{border-radius:0}aside{overflow:visible}}
@media (max-width:640px){.app>header{padding:10px 12px}.app>header p{font-size:12.5px}.seg{flex-wrap:wrap}.seg button{padding:6px 10px}}
@media (prefers-reduced-motion: reduce){.btn,.seg button,.srow,.item{transition:none}}
.dlg .themes{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.dlg .sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.dlg .sw i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dlg .sw[aria-pressed="true"]{border-color:var(--neutral);box-shadow:0 0 0 2px color-mix(in srgb,var(--neutral) 30%,transparent)}
.dlg .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
.dlg .cpick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dlg .cpick input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.dlg .cpick button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
.dlg .plist{display:grid;gap:6px;margin:8px 0}
.dlg .prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.dlg .prow.cur{border-color:color-mix(in srgb,var(--neutral) 55%,var(--line))}
.dlg .prow small{display:block;color:var(--muted);font-size:12px}
.dlg .prow .a{display:flex;gap:6px}
.dlg .rowb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg .ok{color:var(--run);font-weight:600;font-size:13px}
.btn.reset{background:#2563C9 !important;color:#fff !important}
.tele{position:absolute;left:12px;top:12px;width:250px;border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:var(--sh-2);font-size:12.5px;font-variant-numeric:tabular-nums;z-index:3}
.tele .th{display:flex;align-items:center;gap:8px;margin-bottom:6px}.tele .th b{font:700 15px/1.1 "Barlow Condensed",sans-serif;flex:1}.tele .th button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.tele .g3{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:1px 8px;align-items:baseline}
.tele .g3 span{color:var(--muted)}.tele .g3 b{text-align:right;font-weight:600}
.tele .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.tele .kv span{color:var(--muted)}.tele .kv b{font-weight:600;text-align:right}
.tele .al{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--stop);font-weight:600}
.tele .al div::before{content:"● ";}
.tele .okk{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--run);font-weight:600}
.telebtn{position:absolute;left:12px;top:12px;z-index:3}
.pick .live{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pick .live b{color:var(--run)}
@media (max-width:640px){.tele{width:210px;font-size:11.5px}}
[hidden]{display:none !important}
.ded{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ded-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh-1)}
.ded-g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.ded-g+.ded-g{padding-left:8px;border-left:1px solid var(--line)}
.ded-bar select{height:30px;width:auto;max-width:340px;font-size:13px;padding:2px 8px}
#dedZ{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.ded-sp{flex:1}
.ded-tools .btn[aria-pressed="true"]{background:color-mix(in srgb,var(--neutral) 16%,var(--surface));border-color:var(--neutral)}
.ded-pal{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.ded-sym{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;max-width:92px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;color:#15212C}
.ded-sym span{font-size:10.5px;line-height:1.15;text-align:center}.ded-sym[aria-pressed="true"]{border-color:var(--neutral);box-shadow:0 0 0 2px color-mix(in srgb,var(--neutral) 30%,transparent)}
.ded[hidden]{display:none}.ded-pal[hidden]{display:none}
.ded-stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--surface2);cursor:grab;touch-action:none}
.ded.editing .ded-stage{cursor:crosshair}
.ded-canvas{position:absolute;left:0;top:0;transform-origin:0 0}.ded-canvas svg{display:block;box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:4px}
.ded.editing [data-aid],.ded.editing [data-eid]{cursor:move}
.ded-hint{position:fixed;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:51;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);padding:5px 12px;border-radius:999px;pointer-events:none}
.ded-inp{position:fixed;z-index:60;min-width:160px;height:auto;padding:3px 6px;border:2px solid var(--focus);border-radius:4px;background:#fff;color:#15212C;font-family:"Barlow Condensed","Arial Narrow",sans-serif}

.impdrop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;min-height:110px;border:2px dashed var(--line);border-radius:12px;background:var(--surface);padding:14px;cursor:pointer;margin-top:8px}
.impdrop:hover,.impdrop.over{border-color:var(--neutral);background:color-mix(in srgb,var(--neutral) 6%,var(--surface))}
.impdrop span{font-size:12.5px;color:var(--muted)}
.impbusy{display:flex;align-items:center;gap:10px;margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.impbusy .spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--neutral);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.imptab{width:100%;border-collapse:collapse;font-size:13px}.imptab th{text-align:left;color:var(--muted);font-weight:600;padding:4px}.imptab td{padding:3px 4px;border-top:1px solid var(--line)}
.imptab input,.imptab select{height:30px;font-size:13px;padding:2px 6px}.imptab td:first-child{font-weight:700;white-space:nowrap}


/* ===== Menus e refinamentos visuais ===== */
.ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .ic{margin-right:2px}.mbtn .ic:last-child{width:14px;height:14px;margin:0 -2px 0 2px;opacity:.7}
.brand{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--neutral),color-mix(in srgb,var(--neutral) 60%,#7fd4ff));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--neutral) 35%,transparent);align-self:center}
.brand .ic{width:19px;height:19px;stroke-width:2.2}
.app>header{align-items:center}
.app>header h1{font-size:21px}
.hdr-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.icbtn span{min-width:38px;text-align:left}
.menu{position:relative;display:inline-flex}
.mlist{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:240px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--sh-2);display:flex;flex-direction:column;gap:2px}
.mlist[hidden]{display:none}
.mlist.right,.hdr-r .mlist{left:auto;right:0}
.mlist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font:500 14px/1.2 Barlow,sans-serif;color:var(--ink)}
.mlist button:hover,.mlist button:focus-visible{background:var(--surface2);outline:none}
.mlist button .ic{color:var(--muted)}
.mlist button.chk::before{content:"";width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:12px;line-height:1}
.mlist button.chk[aria-pressed="true"]::before{content:"✓";background:var(--neutral);border-color:var(--neutral);color:#fff}
.mlist hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.tgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar{gap:10px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:70;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--sh-2);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
details.sec{border-bottom:1px solid var(--line);padding:2px 0 10px}
details.sec:last-child{border-bottom:0}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 2px 8px;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .sic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--neutral) 12%,var(--surface));color:var(--neutral);flex:0 0 auto}
details.sec>summary .stt{flex:1;font:700 17px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--ink)}

details.sec:not([open])>summary>.ic{transform:rotate(-90deg)}
details.sec>summary:hover .stt{color:var(--neutral)}
details.sec>summary:focus-visible{outline:2px solid var(--focus);border-radius:8px}
aside{padding-top:8px}
details.sec,details.sec *{box-sizing:border-box}
aside details.sec,aside details.sec>*{min-width:0}
aside .row2>*,aside .g2>*,aside .g3>*{min-width:0}

#btnDoor .ic{margin-right:2px}
@media (prefers-reduced-motion: reduce){#toast,details.sec>summary>.ic{transition:none}}
@media (max-width:640px){.icbtn span,.hdr-r .btn:not(.mbtn):not(.icbtn){font-size:0;gap:0}.hdr-r .btn .ic{margin:0}}

</style>

/* ============ Dimensionamento ============ */
function dims(c){
  const v=c.val;
  switch(c.kind){
    case 'brk': return v<=63?{w:18*(c.poles||3),h:90,d:75}:v<=250?{w:105,h:160,d:100}:{w:140,h:255,d:110};
    case 'mpcb': return v<=32?{w:45,h:100,d:90}:v<=65?{w:55,h:140,d:120}:{w:70,h:165,d:130};
    case 'cont': return v<=18?{w:45,h:85,d:95}:v<=38?{w:55,h:90,d:105}:v<=65?{w:70,h:120,d:125}:v<=95?{w:85,h:130,d:130}:{w:120,h:165,d:150};
    case 'olr': return v<=38?{w:45,h:80,d:90}:v<=65?{w:55,h:100,d:110}:{w:70,h:120,d:120};
    case 'timer': return {w:22.5,h:90,d:70};
    case 'servo': return v<=0.4?{w:42,h:165,d:135}:v<=1?{w:55,h:175,d:170}:v<=3?{w:70,h:200,d:190}:{w:90,h:250,d:210};
    case 'rlyb': return {w:c.ch>8?205:115,h:95,d:60};
    case 'vfd': return v<=10?{w:75,h:200,d:160}:v<=24?{w:115,h:250,d:180}:v<=45?{w:150,h:300,d:200}:v<=88?{w:200,h:400,d:230}:{w:250,h:520,d:260};
    case 'soft': return v<=30?{w:45,h:130,d:130}:v<=85?{w:55,h:150,d:150}:{w:130,h:230,d:180};
    case 'psu': return v<=2.5?{w:36,h:90,d:90}:v<=5?{w:60,h:125,d:100}:v<=10?{w:90,h:125,d:120}:{w:125,h:125,d:125};
    case 'plc': if(c.brand==='unitronics'){const u=uniMods(c);return{w:26*(u.di+u.do+u.an)+30,h:100,d:75}} return {w:110+(c.exp||0)*40,h:100,d:75};
    case 'tx': return {w:17.5,h:90,d:60};
    case 'dps': return {w:72,h:90,d:70};
    case 'safe': return c.ctrl?{w:45*(1+(c.exp||0)),h:100,d:115}:{w:22.5,h:100,d:115};
    case 'term': return {w:c.count*5.2,h:55,d:45};
    default: return {w:0,h:0,d:0};
  }
}
function heatOf(c,load){
  const v=c.val||0;
  switch(c.kind){
    case 'brk': return 1+v*0.08*(c.poles||3)/3;
    case 'mpcb': return 2+v*0.15;
    case 'cont': return 1.5+v*0.06;
    case 'olr': return 1+v*0.08;
    case 'timer': return 1;
    case 'vfd': return load?load.kw*1000*0.03:20;
    case 'servo': return load?Math.max(8,load.kw*1000*0.05):10;
    case 'rlyb': return c.ch*0.4;
    case 'soft': return (load?load.In:v)*0.5;
    case 'psu': return v*24*0.12;
    case 'plc': return 10+(c.exp||0)*2;
    case 'tx': return 1;
    case 'dps': return 0.3;
    case 'safe': return c.ctrl?5+2*(c.exp||0):2;
    case 'term': return c.count*0.1;
    default: return 0;
  }
}

  const alerts=[];
  comps.forEach(c=>{
    if(c.status==='under') alerts.push({lv:'e',key:c.key,t:`${c.tag}: ${c.desc.toLowerCase()} de ${c.label} está abaixo do necessário (${fmtA(c.req)}).`});
    if(c.status==='over') alerts.push({lv:'w',key:c.key,t:`${c.tag}: a faixa ${c.label} começa acima da corrente de ${fmtA(c.req)} e não protegerá o motor contra sobrecarga.`});
  });
  if(!lay.fit) alerts.push({lv:'e',t:`Os componentes precisam de ${Math.round(lay.used)} mm de altura, mas a placa tem ${lay.Bh} mm. Use “Dimensionar automaticamente” ou escolha um quadro maior.`});
  else if(lay.used/lay.Bh>0.8) alerts.push({lv:'w',t:`Ocupação da placa em ${Math.round(lay.used/lay.Bh*100)}%. Recomenda-se deixar 20% de reserva para ampliações.`});
  if(flow>0) alerts.push({lv:fan?'w':'e',t:fan?`Dissipação de ${fmt(P,0)} W supera os ${fmt(Pnat,0)} W que o quadro dissipa naturalmente a ${state.amb} °C. Ventilador de ${fan} m³/h incluído na lista.`:`Calor excessivo (${fmt(P,0)} W). Ventilação forçada não basta; considere ar-condicionado de painel ou quadro maior.`});
  loads.forEach(l=>{
    if(l.start==='direta'&&cv(l.kw)>5.01) alerts.push({lv:'w',t:`${l.tag}: partida direta de ${fmt(cv(l.kw))} cv. Muitas concessionárias limitam a partida direta a 5 cv em baixa tensão; avalie estrela-triângulo, soft-starter ou inversor.`});
    if(l.start==='estrela') alerts.push({lv:'i',t:`${l.tag}: o motor precisa ter 6 terminais e tensão em triângulo igual à da rede (ex.: 380/660 V para rede de 380 V).`});
    if(l.start==='inversor'&&l.kw>=7.5) alerts.push({lv:'i',t:`${l.tag}: para inversores a partir de 7,5 kW, considere reatância de rede e cabo blindado até o motor.`});
  });
  let nr=null;
  if(state.nr12.on){
    const it=[];const add=(ok,t,ref,d)=>it.push({ok,t,ref,d});
    add(state.nr12.loto,'Chave geral com bloqueio por cadeado para intervenções','NR-12 · instalações elétricas',state.nr12.loto?'Manopla do -Q0 com cadeado e etiqueta':'Ative o bloqueio da chave geral');
    add(state.ctrl==='24Vcc','Interface de operação em extra-baixa tensão','NR-12 · 12.4',state.ctrl==='24Vcc'?'Comando em 24 Vcc':'Comando em 220 Vca; a norma pede até 25 Vca ou 60 Vcc');
    const noE=loads.filter(l=>!l.estop);
    add(!noE.length,'Parada de emergência acessível com rearme manual','NR-12 · 12.6 / 12.6.8',noE.length?`Sem botoeira no posto: ${noE.map(l=>l.tag).join(', ')}`:'Emergência na porta e nos postos + rearme -S01');
    add(true,`Interface de segurança categoria ${state.nr12.cat} monitorando emergências e proteções`,'NR-12 · 12.5',safeInfo.fn.length<=3?`${safeInfo.fn.length} relé(s) de segurança`:'Controlador de segurança programável');
    const badKS=comps.filter(c=>c.safety&&c.status==='under');
    add(!badKS.length,'Redundância e monitoramento dos contatores de potência','NR-12 · 12.5',badKS.length?`Subdimensionado: ${badKS.map(c=>c.tag).join(', ')}`:'Dois contatores em série com contatos espelho ou STO dupla via');
    const noG=loads.filter(l=>!l.guard&&!l.curtain&&!l.twohand);
    add(!noG.length,'Proteção nas zonas de perigo de cada máquina','NR-12 · 12.5',noG.length?`Sem proteção definida: ${noG.map(l=>l.tag).join(', ')}`:'Proteções intertravadas, cortinas ou bimanual definidos');
    add(state.nr12.tower,'Sinalização de estado e de perigo','NR-12 · sinalização',state.nr12.tower?'Coluna luminosa + placas de perigo':'Placas de perigo incluídas; coluna luminosa desativada');
    add(null,'Análise de risco, diagramas, manual e ART do projeto','NR-12 · documentação','Fora do escopo deste app: exige responsável técnico');
    nr={it,score:it.filter(x=>x.ok===true).length,total:it.filter(x=>x.ok!==null).length,safeInfo};
    if(state.ctrl!=='24Vcc')alerts.push({lv:'e',t:'NR-12: a interface de operação (botões, sinaleiros) deve operar em extra-baixa tensão, até 25 Vca ou 60 Vcc. Mude a tensão de comando para 24 Vcc.'});
    noG.forEach(l=>alerts.push({lv:'w',t:`${l.tag}: nenhuma proteção definida para a zona de perigo. Escolha proteção móvel intertravada, cortina de luz ou bimanual conforme a análise de risco.`}));
    if(state.nr12.cat==='4')loads.filter(DRV).forEach(l=>alerts.push({lv:'i',t:`${l.tag}: para categoria 4 / PL e, confirme no manual do acionamento que a função STO atinge esse nível.`}));
    if(loads.some(l=>l.curtain))alerts.push({lv:'i',t:'Cortinas de luz: calcule a distância de segurança até a zona de perigo com o tempo de parada da máquina (ABNT NBR ISO 13855).'});
  }else alerts.push({lv:'w',t:'Adequação à NR-12 desativada: o quadro não tem redundância, intertravamento nem rearme de segurança.'});
  if(!alerts.some(a=>a.lv==='e'||a.lv==='w')) alerts.unshift({lv:'ok',t:'Dimensionamento consistente: nenhuma incompatibilidade encontrada.'});
  return {E,V,loads,comps,acc,Itot,lay,P,Pnat,A,Tint,flow,fan,mainCable,q0,plcInfo,alerts,nr};
}

function layout(comps,E){
  const Bw=E.W-60,Bh=E.H-80,VD=45,HD=60,L=Bw-2*VD-20;
  const rows=[];let row=null,prevGroup=null;
  const items=[];
  comps.forEach(c=>{
    if(c.kind==='term'){ // divide em réguas
      let rest=c.count,part=0; const per=Math.max(4,Math.floor(L/5.2));
      while(rest>0){const k=Math.min(per,rest);items.push({c,w:k*5.2,h:c.h,d:c.d,newRow:part===0,part,cnt:k});rest-=k;part++}
    } else items.push({c,w:c.w,h:c.h,d:c.d,newRow:!!c.newRow});
  });
  items.forEach(it=>{
    const gap=(prevGroup&&prevGroup!==it.c.group)?16:5;
    if(!row||row.x+gap+it.w>L||(it.newRow&&row.items.length)){row={items:[],x:0,h:0};rows.push(row);it.x=0}
    else it.x=row.x+(row.items.length?gap:0);
    row.x=it.x+it.w;row.h=Math.max(row.h,it.h);row.items.push(it);prevGroup=it.c.group;
    if(it.w>L)row.over=true;
  });
  let y=HD;rows.forEach(r=>{r.h=Math.max(r.h,60)+30;r.y=y;y+=r.h+HD});
  const used=y;
  return {rows,Bw,Bh,VD,HD,L,used,fit:used<=Bh&&!rows.some(r=>r.over),
    railM:rows.length*L/1000,ductM:((rows.length+1)*(Bw-2*VD)+2*Bh)/1000};
}
function autoSize(){
  const keep=state.encl;
  for(const e of ENCL){state.encl=e.id;const m=build();if(m.lay.fit&&m.lay.used<=m.lay.Bh*0.8&&(m.fan||m.flow===0)){refresh(true);return}}
  state.encl=ENCL[ENCL.length-1].id;refresh(true);
}

/* ============ Simulação ============ */
const sim={press:{},q0:false,q0trip:false,q0acc:0,emerg:false,safeLatch:false,loto:false,L:{},t:0,hist:[],log:[]};
function S_(id){return sim.L[id]||(sim.L[id]={state:'off',phase:'Y',t:0,speed:0,I:0,Hz:0,setHz:60,fault:null,ot:0,tripDev:null,warned:false,guardOpen:false,cb:0,latch:false,weld:false,weldLock:false,bim:false,gAng:0})}
function clock(){const s=Math.floor(sim.t);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function log(msg,err){sim.log.unshift({t:clock(),msg,err});sim.log.length=Math.min(sim.log.length,80);renderLog()}
function isRun(s){return s.state==='starting'||s.state==='run'}

const NR=()=>state.nr12.on;
function weldTag(m){return m.start==='soft'?m.parts.U.tag:m.parts.K1.tag}
function safeTag(m){return m.parts.KS?m.parts.KS.tag:''}
function stopLoad(m,s,msg){
  if(!isRun(s))return;
  if(s.weld){
    if(NR()&&m.parts.KS){s.state='coast';s.weldLock=true;log(`${m.tag}: contato de ${weldTag(m)} colado. ${safeTag(m)} abriu e a máquina parou pela redundância; a interface de segurança bloqueou o religamento.`,true);return}
    log(`${m.tag}: contato de ${weldTag(m)} colado. O motor continua girando! Sem redundância, só desligar o -Q0 interrompe.`,true);return;
  }
  s.state='coast';if(msg)log(msg);
}
function safetyBlock(m,s){
  if(!NR())return null;
  if(sim.safeLatch)return 'aguardando rearme de segurança (-S01)';
  if(s.guardOpen)return 'feche a proteção móvel';
  if(s.latch)return 'pressione o rearme de segurança (-S01)';
  return null;
}
function cmd(act,id,val){
  sim.press[act+':'+(id||'')]=performance.now()+700;
  const m=model.loads.find(l=>l.id===id), s=id?S_(id):null;
  switch(act){
    case 'q0':
      if(!sim.q0&&sim.loto){log('-Q0 bloqueado por cadeado: retire o bloqueio para energizar',true);break}
      if(sim.q0trip){sim.q0trip=false;sim.q0acc=0;log('-Q0 rearmado');}
      sim.q0=!sim.q0; log(sim.q0?'Quadro energizado (-Q0 ligado)':'Quadro desenergizado (-Q0 desligado)');
      if(!sim.q0) model.loads.forEach(l=>{const x=S_(l.id);if(isRun(x))x.state='coast'});
      break;
    case 'loto':
      if(sim.q0&&!sim.loto){log('Desligue o -Q0 antes de colocar o cadeado',true);break}
      sim.loto=!sim.loto;log(sim.loto?'-Q0 bloqueado com cadeado e etiqueta: seguro para manutenção':'Cadeado retirado do -Q0');break;
    case 'emerg':
      sim.emerg=!sim.emerg;
      if(sim.emerg){log('Emergência acionada',true);model.loads.forEach(l=>stopLoad(l,S_(l.id),null));if(NR())sim.safeLatch=true}
      else log(NR()?'Emergência destravada. Pressione o rearme de segurança (-S01).':'Emergência destravada');
      break;
    case 'sreset':{
      if(sim.emerg){log('Rearme recusado: destrave a emergência primeiro',true);break}
      const open=model.loads.filter(l=>S_(l.id).guardOpen);
      if(open.length){log(`Rearme recusado: proteção aberta em ${open.map(l=>l.tag).join(', ')}`,true);break}
      const lock=model.loads.filter(l=>S_(l.id).weldLock);
      if(lock.length){log(`Rearme recusado: falha de contator em ${lock.map(l=>l.tag).join(', ')}`,true);break}
      sim.safeLatch=false;model.loads.forEach(l=>S_(l.id).latch=false);
      log('Rearme de segurança concluído. As máquinas não religam sozinhas: cada partida exige novo comando.');break}
    case 'guard':
      s.guardOpen=!s.guardOpen;
      if(s.guardOpen){log(`${m.tag}: proteção móvel aberta`,!!isRun(s));stopLoad(m,s,`${m.tag}: parada de segurança pela chave de intertravamento`);s.latch=true}
      else log(`${m.tag}: proteção fechada. Rearme necessário.`);
      break;
    case 'curtain':
      s.cb=1.6;log(`${m.tag}: feixe da cortina de luz interrompido`,true);stopLoad(m,s,`${m.tag}: parada de segurança pela cortina de luz`);s.latch=true;break;
    case 'start':case 'bimdown':
      if(!sim.q0){log(`${m.tag}: energize o quadro antes de ligar`,true);break}
      if(sim.emerg){log(`${m.tag}: destrave a emergência antes de ligar`,true);break}
      if(s.state==='tripped'){log(`${m.tag}: rearme a proteção ${s.tripDev} antes de ligar`,true);break}
      if(s.weldLock){log(`${m.tag}: substitua ${weldTag(m)} antes de religar`,true);break}
      {const b=safetyBlock(m,s);if(b){log(`${m.tag}: partida bloqueada, ${b}`,true);break}}
      if(isRun(s))break;
      Object.assign(s,{state:'starting',phase:'Y',t:0,ot:0,dT:0,bim:act==='bimdown'});
      log(`${m.tag} partida: ${START[m.start].toLowerCase()}${act==='bimdown'?' (bimanual pressionado)':''}`);break;
    case 'stop':stopLoad(m,s,`${m.tag} desligado`);break;
    case 'bimup':if(s.bim){s.bim=false;stopLoad(m,s,`${m.tag}: bimanual solto, parada`)}break;
    case 'fault':
      if(!val)break;
      if(val==='solda'){s.weld=true;log(`${m.tag}: contato de ${weldTag(m)} colado (falha simulada). Tente desligar a máquina.`,true);break}
      if(val==='curto'){trip(m,s,m.parts.Q.tag,`Curto-circuito na saída de ${m.tag}: ${m.parts.Q.tag} atuou (disparo magnético)`);break}
      if(!isRun(s)){log(`${m.tag}: ligue o motor para simular ${val==='fase'?'falta de fase':'sobrecarga'}`,true);break}
      s.fault=val;s.ot=0;log(`${m.tag}: ${val==='fase'?'falta de fase simulada':'sobrecarga mecânica simulada'}`,true);
      if(val==='fase'&&DRV(m))trip(m,s,m.parts.U.tag,`${m.parts.U.tag}: falha por falta de fase na entrada`);
      break;
    case 'reset':
      if(s.weld&&!isRun(s)){s.weld=false;s.weldLock=false;log(`${m.tag}: ${weldTag(m)} substituído`);break}
      if(s.state==='tripped'){s.state='coast';s.fault=null;s.ot=0;log(`${m.tag}: proteção ${s.tripDev} rearmada`);s.tripDev=null}break;
    case 'hz': s.setHz=+val;break;
  }
  buildSimRows();updateSimUI();
}
function trip(m,s,dev,msg){s.state='tripped';s.tripDev=dev;s.I=0;s.fault=null;log(msg,true)}
function protCap(m){ // corrente limite do dispositivo de proteção
  const p=m.parts;
  if(m.start==='estrela') return Math.min(Math.max(m.In*0.58,p.F.min),p.F.val)/0.58;
  if(m.start==='inversor') return p.U.val;
  if(m.start==='servo') return m.In*p.U.val/m.kw;
  return Math.min(Math.max(m.In,p.Q.min),p.Q.val);
}
function protDev(m){return m.start==='estrela'?m.parts.F.tag:DRV(m)?m.parts.U.tag:m.parts.Q.tag}

function step(dt){
  sim.t+=dt;
  let tot=0;
  model.loads.forEach(m=>{
    const s=S_(m.id),In=m.In,tp=Math.max(1,m.tp||TP_DEFAULT[m.start]||4);
    if(isRun(s)&&(!sim.q0||sim.q0trip))s.state='coast';
    if(s.cb>0)s.cb=Math.max(0,s.cb-dt);
    if(isRun(s)){
      s.t+=dt;
      if(m.start==='direta'){s.speed=Math.min(1,s.speed+dt*1.6);s.I=In*(s.speed<0.97?6.2-5*s.speed:1)}
      else if(m.start==='estrela'){
        if(s.phase==='Y'){s.speed=Math.min(0.85,s.speed+dt*0.9/tp+dt*0.1);s.I=In*(2.1-1.3*s.speed/0.85);if(s.t>=tp){s.phase='gap';s.tg=0;log(`${m.tag}: comutação estrela → triângulo`)}}
        else if(s.phase==='gap'){s.tg+=dt;s.I=0;s.speed=Math.max(0,s.speed-dt*0.3);if(s.tg>0.1){s.phase='D';s.dT=0}}
        else{s.dT+=dt;s.speed=Math.min(1,s.speed+dt*0.8);s.I=In*(1+1.6*Math.exp(-s.dT*3))}
      }
      else if(m.start==='soft'){const r=Math.min(1,s.t/tp);s.speed=Math.max(s.speed,r);s.I=In*(r<1?3.2-2.2*r:1)}
      else{
        const a=60/tp;
        if(s.Hz<s.setHz)s.Hz=Math.min(s.setHz,s.Hz+a*dt);else s.Hz=Math.max(s.setHz,s.Hz-a*dt);
        s.speed=s.Hz/60;s.I=In*(0.3+0.7*s.speed)*(Math.abs(s.Hz-s.setHz)>0.3?1.12:1);
      }
      if(s.state==='starting'){
        const done=DRV(m)?Math.abs(s.Hz-s.setHz)<0.3:(s.speed>=0.99&&(m.start!=='estrela'||(s.phase==='D'&&s.dT>1.6)));
        if(done){s.state='run';log(`${m.tag} em regime (${fmtA(s.I)})`)}
      }
      if(s.fault==='sobrecarga')s.I*=1.5;
      if(s.fault==='fase')s.I*=1.75;
      // proteção térmica
      if(s.state==='run'||s.fault){
        const C=protCap(m);
        if(s.I>C*1.12){s.ot+=dt*(s.I/C)*(s.I/C)/1.25;if(s.ot>=4){
          const dev=protDev(m);
          trip(m,s,dev,`${dev}: ${DRV(m)?'falha de sobrecorrente no acionamento':'proteção térmica atuou'} em ${m.tag}`+(s.fault?'':' (proteção subdimensionada)'));
        }}else s.ot=Math.max(0,s.ot-dt);
        if(!s.warned){const ks=['K1','K2','K3'].map(k=>m.parts[k]).filter(Boolean);if(ks.some(k=>k.status==='under')){s.warned=true;log(`${m.tag}: contator subdimensionado — risco de colagem dos contatos`,true)}}
      }
    }else{
      s.I=0;
      if(DRV(m)&&s.state==='coast'){s.Hz=Math.max(0,s.Hz-60/tp*dt);s.speed=s.Hz/60}
      else{s.speed=Math.max(0,s.speed-dt*0.4);if(DRV(m))s.Hz=0}
      if(s.state==='coast'&&s.speed<=0)s.state='off';
    }
    tot+=s.I;
  });
  // proteção do geral
  if(sim.q0&&!sim.q0trip){
    if(tot>model.q0.val*1.1){sim.q0acc+=dt;if(sim.q0acc>5){sim.q0trip=true;sim.q0=false;log(`-Q0: disjuntor geral desarmou por sobrecarga (${fmtA(tot)})`,true)}}
    else sim.q0acc=Math.max(0,sim.q0acc-dt);
  }
  sim.tot=tot;
  {const on=sim.q0&&!sim.q0trip,T=sim.tel||(sim.tel={kwh:0,tOn:0,Tint:state.amb,fan:false,V:[0,0,0],I:[0,0,0],P:0,S:0,pf:0,Hz:0});
   if(on)T.tOn+=dt;const ld=Math.min(1.5,tot/Math.max(1,model.q0.val)),drop=Math.min(0.05,ld*0.025),t=sim.t;
   T.V=[0,1,2].map(i=>on?model.V*(1-drop+0.003*Math.sin(t*0.9+i*2.1)+0.0015*Math.sin(t*3.7+i)):0);
   T.I=[1,0.986,1.013].map((f,i)=>on?tot*f*(1+0.004*Math.sin(t*2.3+i)):0);
   let ipf=0;model.loads.forEach(l=>{const x=S_(l.id);if(!x.I)return;let pf=DRV(l)?0.95:0.84;if(x.state==='starting'&&(l.start==='direta'||l.start==='estrela'))pf=0.38;if(l.start==='soft'&&x.state==='starting')pf=0.55;ipf+=x.I*pf});
   T.pf=tot>0.05?ipf/tot:0;const Va=(T.V[0]+T.V[1]+T.V[2])/3,Ia=(T.I[0]+T.I[1]+T.I[2])/3;T.S=Math.sqrt(3)*Va*Ia/1000;T.P=T.S*T.pf;T.kwh+=T.P*dt/3600;T.Hz=on?state.Hz+0.03*Math.sin(t*0.4):0;
   // térmico interno (acelerado para a simulação)
   const lf=model.Itot>0?Math.min(1.3,tot/model.Itot):0,Ph=on?model.P*(0.3+0.7*lf*lf):0,kN=5.5*model.A,kF=(T.fan&&model.fan)?0.335*model.fan:0;
   T.Tint+=dt*(Ph-(kN+kF)*(T.Tint-state.amb))/1500;
   if(on&&model.flow>0){if(T.Tint>35)T.fan=true;else if(T.Tint<32)T.fan=false}else T.fan=false;
   T.alarms=[];if(sim.q0trip)T.alarms.push('Disjuntor geral -Q0 desarmado');if(sim.emerg)T.alarms.push('Emergência acionada');
   model.loads.forEach(l=>{const x=S_(l.id);if(x.state==='tripped')T.alarms.push(`${l.tag}: ${x.tripDev} desarmado`);if(x.weldLock)T.alarms.push(`${l.tag}: contator colado`);if(x.guardOpen)T.alarms.push(`${l.tag}: proteção aberta`)});
   if(model.nr&&on&&safeState()==='reset'&&!sim.emerg)T.alarms.push('Aguardando rearme de segurança');if(T.Tint>40)T.alarms.push(`Temperatura interna alta (${fmt(T.Tint,0)} °C)`);}
  sim.acc=(sim.acc||0)+dt;
  if(sim.acc>0.1){sim.acc=0;sim.hist.push(tot);if(sim.hist.length>300)sim.hist.shift()}
}
function contacts(m){const s=S_(m.id),r=isRun(s);
  const w=s.weld&&m.start!=='soft';
  return{K1:r||w,K2:r&&s.phase==='D',K3:r&&s.phase==='Y',KS:r,KS2:r,U:r||(DRV(m)&&s.Hz>0.1)||(m.start==='soft'&&s.weld)}}
function safeState(){if(!NR())return 'off';if(sim.emerg)return 'emerg';if(sim.safeLatch||model.loads.some(l=>{const s=S_(l.id);return s.latch||s.guardOpen||s.weldLock}))return 'reset';return 'ok'}

function renderLeft(){
  if(isAlt()){renderLeftAlt();return}
  const opt=(arr,cur,lab=x=>x)=>arr.map(v=>`<option value="${v}" ${String(v)===String(cur)?'selected':''}>${lab(v)}</option>`).join('');
  $('#left').innerHTML=`

function renderLog(){const el=$('#log');if(el)el.innerHTML=sim.log.map(l=>`<div class="${l.err?'e':''}">${l.t} · ${esc(l.msg)}</div>`).join('')||'<div>Energize o quadro e ligue um motor para começar.</div>'}
function statusText(m,s){
  if(s.state==='tripped')return['trip','Desarmado ('+s.tripDev+')'];
  if(s.weldLock)return['trip','Contator colado detectado'];
  if(!isRun(s)&&s.state!=='coast'&&NR()){if(s.guardOpen)return['wait','Proteção aberta'];if(s.latch||sim.safeLatch)return['wait','Aguardando rearme']}
  if(s.state==='starting'){
    if(m.start==='estrela')return['wait',s.phase==='Y'?'Partida em estrela':'Comutando'];
    if(m.start==='soft')return['wait','Rampa de partida'];
    if(DRV(m))return['wait','Acelerando'];
    return['wait','Partindo'];
  }
  if(s.state==='run')return[s.ot>0.3?'wait':'on',s.ot>0.3?'Sobrecorrente':'Em operação'];
  if(s.state==='coast')return['','Parando'];
  return['','Parado'];
}
function fmtDur(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`}

function liveInfo(key){if(!key||!model)return '';const on=sim.q0&&!sim.q0trip,T=sim.tel||{};
  if(key.startsWith('motor:')){const l=model.loads.find(x=>'motor:'+x.id===key);if(!l)return '';const s=S_(l.id),[,tx]=statusText(l,s);const rpm=Math.round(s.speed*(l.start==='servo'?3000:1750));

  const c=model.comps.find(x=>x.key===key);if(!c)return '';if(!on)return 'Quadro desenergizado';

async function reencodeImages(json){if(!json.images)return;const imgs=Array.isArray(json.images)?json.images:Object.values(json.images);
  for(const im of imgs){const u=typeof im.url==='string'?im.url:null;if(!u||!u.startsWith('data:image/png')||u.length<30000)continue;
    try{const i=new Image();i.src=u;await i.decode();const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);
      const d=x.getImageData(0,0,c.width,c.height).data;let alpha=false;for(let k=3;k<d.length;k+=64){if(d[k]<250){alpha=true;break}}
      if(!alpha)im.url=c.toDataURL('image/jpeg',0.86)}catch(e){}}}

function buildForca(){

  const Iph=[0,0,0];feeders.forEach(d=>{if(d.ph===null)Iph.forEach((_,j)=>Iph[j]+=d.Ib);else Iph[d.ph]+=d.Ib});
  const Imax=Math.max(...Iph)*f.dem,Iavg=(Iph[0]+Iph[1]+Iph[2])/3,deseq=Iavg?(Math.max(...Iph)-Math.min(...Iph))/Iavg:0;
  const mainIn=LVMAIN.find(v=>v>=Math.max(63,Imax*1.1))||4000;const matF=f.material==='al'?0.78:1;

  feeders.forEach(d=>{const w=d.bw+(d.drw?d.drw+6:0),h=d.mccb?(d.In>250?255:160):90;d.w=w;d.h=h;
    if(!row||row.x+w+20>avail){row={x:0,h:0,items:[]};rows.push(row)}d.rx=row.x;row.x+=w+20;row.h=Math.max(row.h,h);row.items.push(d)});
  const mainW=entrada==='acb'?Math.max(280,mainIn>1600?360:300):entrada==='sec'?(mainIn>250?200:150):(mainIn>630?210:mainIn>250?140:105);

  let capac=null;if(f.capac){const kvar=Math.max(0,P*(Math.tan(Math.acos(fpMed))-Math.tan(Math.acos(f.fpAlvo))));const st=Math.max(1,Math.ceil(kvar/15));const step=Math.max(2.5,Math.ceil(kvar/st/2.5)*2.5);capac={kvar,st,step,tot:st*step}}
  const need=400+rows.reduce((a,r)=>a+r.h+90,0)+280+(capac?320:0);const autoH=[1200,1400,1600,1800,2000,2200].find(h=>h>=need)||2200;
  const H=f.encH==='auto'?autoH:+f.encH,D=f.encD==='auto'?(H>=1800?600:500):+f.encD;const E={W,H,D,id:`${H}x${W}x${D}`};
  const alerts=[];
  if(H<need)alerts.push({lv:'e',t:`A altura escolhida (${H} mm) é menor que a necessária (${Math.round(need)} mm) para acomodar a entrada, o barramento e os circuitos. Aumente a altura ou use "Automático".`});
  if(W<autoW)alerts.push({lv:'w',t:`Largura de ${W} mm abaixo da recomendada (${autoW} mm) para ${nfd} circuitos: pouco espaço para curvatura dos cabos.`});
  if(deseq>0.1)alerts.push({lv:'w',t:`Desequilíbrio de corrente entre fases de ${Math.round(deseq*100)}%. Redistribua os circuitos monofásicos para ficar abaixo de 10%.`});
  feeders.forEach(d=>{if(d.kw<=0)alerts.push({lv:'w',t:`${d.tag}: potência não informada.`});if(d.dv>f.dvmax)alerts.push({lv:'e',t:`${d.tag} ${d.name}: queda de tensão de ${fmt(d.dv,1)}% mesmo com o maior cabo; revise a distância ou divida o circuito.`});else if(d.dvUp)alerts.push({lv:'i',t:`${d.tag} ${d.name}: cabo aumentado para ${fmt(d.cab)} mm² pela queda de tensão (${fmt(d.dv,1)}% em ${d.dist} m).`})});
  if(!f.capac&&fpMed<0.92)alerts.push({lv:'w',t:`Fator de potência médio estimado de ${fmt(fpMed,2)}, abaixo do valor de referência 0,92 da ANEEL: considere um banco de capacitores.`});
  if(entrada==='acb'&&mainIn<630)alerts.push({lv:'i',t:'Disjuntor aberto (ACB) para correntes abaixo de 630 A costuma ser antieconômico; a caixa moldada atende.'});

  if(FC<0.8)alerts.push({lv:'i',t:`Fatores de correção aplicados aos cabos: temperatura ${fmt(FT,2)} × agrupamento ${fmt(FG,2)} × método ${fmt(FM,2)} = ${fmt(FC,2)}.`});
  alerts.push({lv:'i',t:'Dimensionamento de referência (NBR 5410): confirme capacidade de condução com o método de instalação, agrupamento e temperatura reais, e a corrente de curto-circuito no ponto.'});
  if(!alerts.some(a=>a.lv==='e'||a.lv==='w'))alerts.unshift({lv:'ok',t:'Distribuição equilibrada e proteções coordenadas com os cabos.'});
  return {kind:'forca',E,V,feeders,Iph,Imax,Iavg,deseq,mainIn,bus,par,mainCab,rows,mainW,mainH,alerts,dem:f.dem,entrada,FC,FT,FG,FM,fpMed,Ptot:P,capac,need,matF};

function buildPrimaria(){

  const Ip=kva/(Math.sqrt(3)*kV),Is=kva*1000/(Math.sqrt(3)*Vs),Z=p.Z==='auto'?(kva<=300?4.5:kva<=1000?5:6):+p.Z,Icc=Is/(Z/100)/1000;
  const IccMT=p.mva/(Math.sqrt(3)*kV),cbKa=[16,20,25,31.5].find(v=>v>=IccMT)||31.5;
  const TCR=[5,10,15,20,25,30,40,50,60,75,100,150,200];const tc=TCR.find(v=>v>=Ip*1.5)||200;
  const cls=kV<=15?{Um:'17,5 kV',pr:'12 kV',cab:'8,7/15 kV',NBI:'95 kV'}:kV<=25?{Um:'24 kV',pr:'21 kV',cab:'12/20 kV',NBI:'125 kV'}:{Um:'36 kV',pr:'30 kV',cab:'20/35 kV',NBI:'170 kV'};
  const prot=p.prot==='auto'?(kva>300?'disjuntor':'fusivel'):p.prot;
  const fuse=[6.3,10,16,20,25,31.5,40,50,63,80,100].find(v=>v>=Ip*2)||100;
  const qg=LVMAIN.find(v=>v>=Is*1.1)||4000,nC=Math.ceil(Is*1.1/332);
  const cabMT=p.cabMT==='auto'?(Ip<=90?35:Ip<=140?50:70):+p.cabMT;
  const tw=Math.round(800+kva*0.7),td=Math.round(650+kva*0.45),th=Math.round(1150+kva*0.45);
  const cubs=[{key:'C1',tag:'CB-01',name:p.med==='MT'?'Entrada e medição':'Entrada',w:1000},{key:'C2',tag:'CB-02',name:'Proteção geral',w:900},{key:'C3',tag:'CB-03',name:'Transformador',w:Math.max(1400,tw+600)},{key:'QG',tag:'QGBT',name:'Quadro geral de BT',w:900,lv:true}];
  if(p.ger)cubs.push({key:'QTA',tag:'QTA',name:'Transferência automática',w:800,lv:true});

  const funcs=['50/51','50N/51N'].concat(p.r2759?['27/59']:[],p.r81?['81']:[],p.r47?['47']:[],p.r67?['67N']:[]);
  const gIn=p.ger?LVMAIN.find(v=>v>=p.gerKva*1000/(Math.sqrt(3)*Vs)*1.1)||4000:0;
  let capac=null;if(p.capac){const Pk=kva*(p.carga/100)*0.85;const kvar=Pk*(Math.tan(Math.acos(0.85))-Math.tan(Math.acos(p.fpAlvo)));const st=Math.max(2,Math.ceil(kvar/25));const step=Math.ceil(kvar/st/5)*5;capac={kvar,st,step,tot:st*step}}

  else if(prot==='disjuntor')alerts.push({lv:'i',t:`Proteção geral em média tensão por disjuntor a vácuo com relé secundário (funções ${funcs.join(', ')}), conforme NBR 14039 e o padrão da concessionária.`});
  else alerts.push({lv:'i',t:`Proteção geral por chave seccionadora com fusíveis HH de ${fmt(fuse,1)} A (até 300 kVA, quando aceito pela concessionária).`});
  if(IccMT>cbKa*0.95)alerts.push({lv:'w',t:`Curto-circuito na média tensão (${fmt(IccMT,1)} kA) próximo da capacidade do disjuntor (${fmt(cbKa,1)} kA).`});

}

const AS={q0:false,q0trip:false,q0acc:0,fd:{},t:0,kwh:0,tOn:0,hist:[],P:{sec:false,gnd:false,cb:false,qg:false,qgTrip:false,lock:false,flag:'',fault:null,Toil:null,inrush:0,ot:0}};

function altLog(m,e){log(m,e)}
function altCmd(act,id,val){
  const m=AM;if(!m)return;
  if(m.kind==='forca'){
    if(act==='aq0'){if(AS.q0trip){AS.q0trip=false;AS.q0acc=0;altLog('-Q0 rearmado')}AS.q0=!AS.q0;altLog(AS.q0?'Quadro de força energizado (-Q0 ligado)':'Quadro de força desligado (-Q0)')}
    else if(act==='afd'){const s=FD(id),d=m.feeders.find(x=>x.id===id);if(s.trip){s.trip=false;s.fault=null;s.ot=0;altLog(`${d.tag} rearmado`)}else{s.on=!s.on;altLog(`${d.tag} ${d.name}: ${s.on?'ligado':'desligado'}`)}}
    else if(act==='afault'){const s=FD(id),d=m.feeders.find(x=>x.id===id);if(!val)return;
      if(!AS.q0||!s.on){altLog(`${d.tag}: ligue o circuito para simular a falha`,true);return}
      if(val==='curto'){s.trip=true;s.I=0;altLog(`${d.tag}: curto-circuito no circuito "${d.name}" — disparo magnético instantâneo`,true)}else{s.fault='sobrecarga';s.ot=0;altLog(`${d.tag}: sobrecarga simulada no circuito "${d.name}"`,true)}}
  }else{const P=AS.P;
    if(act==='psec'){if(P.cb){altLog('Intertravamento: abra o disjuntor -52 antes de manobrar a seccionadora (não opera sob carga)',true);return}
      if(!P.sec&&P.gnd){altLog('Intertravamento: abra a chave de aterramento antes de fechar a seccionadora',true);return}P.sec=!P.sec;altLog(`Seccionadora -Q1 ${P.sec?'fechada':'aberta'}`)}
    else if(act==='pgnd'){if(P.sec){altLog('Intertravamento: a chave de aterramento só fecha com a seccionadora aberta',true);return}P.gnd=!P.gnd;altLog(`Chave de aterramento ${P.gnd?'fechada: circuito aterrado para manutenção':'aberta'}`)}
    else if(act==='p52on'){if(P.cb)return;if(!P.sec){altLog('Disjuntor -52: feche a seccionadora -Q1 antes',true);return}if(P.lock){altLog('Disjuntor bloqueado pelo relé 86: verifique o defeito e rearme o relé',true);return}
      P.cb=true;P.inrush=8;altLog('Disjuntor -52 fechado: transformador energizado (corrente de magnetização inicial)')}
    else if(act==='p52off'){if(P.cb){P.cb=false;altLog('Disjuntor -52 aberto')}}
    else if(act==='p86'){if(P.fault==='curtoMT'||P.fault==='terra'){P.fault=null}if(P.lock){P.lock=false;P.flag='';altLog('Relé de proteção rearmado (86 resetado)')}}

    else if(act==='pload'){state.prim.carga=+val;AM.carga=+val;save()}
    else if(act==='pfault'){if(!val)return;

      else if(val==='curtoMT'||val==='terra'){if(!P.cb){altLog('Feche o disjuntor -52 para simular',true);return}P.fault=val;P.cb=false;P.lock=true;P.flag=val==='terra'?'50N':'50';altLog(`Relé atuou (${P.flag}): ${val==='terra'?'falta à terra':'curto-circuito'} na média tensão — disjuntor -52 aberto e bloqueado (86)`,true)}
      else if(val==='sobrecarga'){P.fault='sobrecarga';altLog('Sobrecarga de 150% simulada no transformador',true)}
      else if(val==='temp'){P.fault='temp';altLog('Ventilação da cabine obstruída: temperatura do transformador subindo',true)}
      else if(val==='semrede'){P.fault='semrede';altLog('Falta de energia da concessionária',true)}}

}
function altStep(dt){const m=AM;if(!m)return;AS.t+=dt;const t=AS.t;const T=AS.tel||(AS.tel={});
  if(m.kind==='forca'){let I=[0,0,0],P=0,Q=0;const on=AS.q0&&!AS.q0trip;
    m.feeders.forEach((d,i)=>{const s=FD(d.id);let Ia=0;if(on&&s.on&&!s.trip){Ia=d.Ib*(0.78+0.12*Math.sin(t*0.25+i*1.7)+0.03*Math.sin(t*2.1+i))*(s.fault==='sobrecarga'?1.55:1);
        if(Ia>d.In*1.12){s.ot+=dt*(Ia/d.In)*(Ia/d.In)/1.3;if(s.ot>=4){s.trip=true;s.fault=null;Ia=0;altLog(`${d.tag}: disparo térmico por sobrecarga em "${d.name}"`,true)}}else s.ot=Math.max(0,s.ot-dt)}
      s.I=Ia;if(d.ph===null)I=I.map(v=>v+Ia);else I[d.ph]+=Ia;const kw=d.ph===null?Math.sqrt(3)*m.V*Ia*d.fp/1000:(m.V/Math.sqrt(3))*Ia*d.fp/1000;P+=kw;Q+=kw*Math.tan(Math.acos(d.fp))});
    if(on&&Math.max(...I)>m.mainIn*1.08){AS.q0acc+=dt;if(AS.q0acc>5){AS.q0trip=true;AS.q0=false;altLog('-Q0: disjuntor geral disparou por sobrecarga',true)}}else AS.q0acc=Math.max(0,AS.q0acc-dt);
    const drop=Math.min(0.04,Math.max(...I)/m.mainIn*0.02);T.V=[0,1,2].map(i=>on?m.V*(1-drop+0.003*Math.sin(t*0.8+i*2)):0);T.I=I;T.P=P;T.S=Math.sqrt(P*P+Q*Q);T.pf=T.S?P/T.S:0;T.Hz=on?state.Hz+0.03*Math.sin(t*0.4):0;
    if(on)AS.tOn+=dt;AS.kwh+=P*dt/3600;
    T.alarms=[];if(AS.q0trip)T.alarms.push('-Q0 disparado');m.feeders.forEach(d=>{if(FD(d.id).trip)T.alarms.push(`${d.tag} disparado — ${d.name}`)});
  }else{const P=AS.P;const net=P.fault!=='semrede',mt=net&&P.sec,tr=mt&&P.cb,lv=tr,ld=lv&&P.qg;
    P.inrush=Math.max(0,P.inrush*Math.exp(-dt/0.18));
    const load=ld?(m.carga/100)*(P.fault==='sobrecarga'?1.5:1):0;const Is=m.Is*load*(1+0.02*Math.sin(t*0.3)),Ip=Is*m.Vs/(m.kV*1000)+(tr?m.Ip*(0.012+P.inrush):0);
    if(tr&&Ip>m.p51&&P.inrush<0.5){P.ot+=dt*((Ip/m.p51)**2-1)*0.35;if(P.ot>=1){P.cb=false;P.lock=true;P.flag='51';P.ot=0;altLog('Relé 51 (sobrecorrente temporizada) atuou: disjuntor -52 aberto e bloqueado',true)}}else P.ot=Math.max(0,P.ot-dt*0.2);
    if(P.Toil===null)P.Toil=state.amb;const Tt=tr?state.amb+(m.trafo==='oleo'?50:60)*(0.18+0.82*load*load)+(P.fault==='temp'?45:0):state.amb;P.Toil+=(Tt-P.Toil)*Math.min(1,dt/14);
    if(tr&&P.Toil>(m.trafo==='oleo'?105:140)){P.cb=false;P.lock=true;P.flag='26';altLog('Proteção térmica do transformador (26) atuou: disjuntor -52 aberto',true)}
    T.Vmt=[0,1,2].map(i=>net?m.kV*(1+0.004*Math.sin(t*0.7+i*2)):0);T.Imt=[1,0.99,1.01].map(f=>Ip*f);
    T.V=[0,1,2].map(i=>lv?m.Vs*(1-0.03*load+0.003*Math.sin(t*0.9+i*2)):0);T.I=[1,0.985,1.012].map(f=>Is*f);const pf=0.92;T.S=Math.sqrt(3)*m.Vs*Is/1000;T.P=T.S*pf;T.pf=Is?pf:0;T.Hz=net?state.Hz+0.03*Math.sin(t*0.4):0;
    T.load=load;if(lv)AS.tOn+=dt;AS.kwh+=T.P*dt/3600;
    T.alarms=[];if(!net)T.alarms.push('Sem tensão da concessionária');if(P.lock)T.alarms.push(`Relé ${P.flag||'86'} atuado — disjuntor bloqueado`);if(P.qgTrip)T.alarms.push('-QG disparado');
    if(P.Toil>(m.trafo==='oleo'?95:120))T.alarms.push(`Temperatura do transformador alta (${fmt(P.Toil,0)} °C)`);if(P.gnd)T.alarms.push('Chave de aterramento fechada');}
}
